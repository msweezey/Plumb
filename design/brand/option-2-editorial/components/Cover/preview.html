<!-- @dsCard height=300 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Archivo:wght@400;500&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bone); position: relative; width: 960px; height: 300px; overflow: hidden; font-family: var(--font-sans); }
  svg { position: absolute; left: 0; top: 0; }
  .ink { fill: var(--ink); }
  .sig { fill: var(--signal); }
  .soft { fill: var(--rule-soft); }
  .r-ink { stroke: var(--ink); stroke-width: 2; }
  .r-bone { stroke: var(--bone); stroke-width: 1; }
  .name { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 120px; line-height: .9; letter-spacing: -0.02em; color: var(--ink); text-transform: uppercase; }
  .name p { margin: 14px 0 0; font-size: 14px; line-height: 18px; color: var(--lead); }
</style>
</head>
<body>
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
  <!--
    blocks: ink 240x300 (the black band), signal 96x96 (the bob), rule-soft 120x300 (hairline field) — sides from space-24 and space-12 multiples, corners radius-0
    arrangement: one tall ink slab bleeding top and bottom with a red square satellite hanging below a red line, a quiet soft band at the right edge
    pattern: editorial, "rules, not boxes" (README) chose a few horizontal hairlines crossing the ink slab at space-12 pitch, plus the plumb line itself
    scales: rules 1px bone at 48px pitch; plumb line 5px; all corners radius-0
  -->
  <rect class="soft" x="840" y="0" width="120" height="300"/>
  <rect class="ink" x="552" y="0" width="240" height="300"/>
  <line class="r-bone" x1="552" y1="48" x2="792" y2="48"/>
  <line class="r-bone" x1="552" y1="96" x2="792" y2="96"/>
  <line class="r-bone" x1="552" y1="144" x2="792" y2="144"/>
  <line class="r-bone" x1="552" y1="192" x2="792" y2="192"/>
  <rect class="sig" x="503" y="0" width="5" height="156"/>
  <rect class="sig" x="487" y="156" width="37" height="37"/>
  <line class="r-ink" x1="480" y1="252" x2="840" y2="252"/>
</svg>
<div class="name">
  <h1>Plumb</h1>
  <p>Option 2 · Know what good looks like.</p>
</div>
</body>
</html>
